name: Blender 5.2 validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Publish final X.Y.Z release; leave empty for validation only
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cats-blender-5-2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate, package, install, and test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows
          - runner: ubuntu-24.04
            platform: linux
          - runner: macos-15
            platform: macos

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify and extract Blender 5.2.0
        id: blender
        run: >-
          python scripts/ci.py prepare-blender
          --platform '${{ matrix.platform }}'
          --output-dir '${{ runner.temp }}/blender-5.2.0'
          --github-output "$GITHUB_OUTPUT"

      - name: Check Python syntax
        run: >-
          '${{ steps.blender.outputs.python }}'
          -W ignore::SyntaxWarning -m compileall -q -f
          __init__.py globs.py extentions.py updater.py
          tools ui extern_tools tests

      - name: Validate extension source
        run: >-
          '${{ steps.blender.outputs.blender }}'
          --command extension validate .

      - name: Build and validate extension package
        run: |
          set -euo pipefail
          package_path='${{ runner.temp }}/cats_blender_plugin.zip'
          '${{ steps.blender.outputs.blender }}' \
            --command extension build \
            --source-dir . \
            --output-filepath "${package_path}"
          '${{ steps.blender.outputs.blender }}' \
            --command extension validate "${package_path}"
          '${{ steps.blender.outputs.python }}' \
            tests/verify_package.py "${package_path}" --source-dir .
          echo "PACKAGE_PATH=${package_path}" >> "${GITHUB_ENV}"

      - name: Create isolated extension repository
        run: |
          set -euo pipefail
          export BLENDER_USER_RESOURCES="${RUNNER_TEMP}/blender-user/resources"
          export BLENDER_USER_CONFIG="${RUNNER_TEMP}/blender-user/config"
          export BLENDER_USER_SCRIPTS="${RUNNER_TEMP}/blender-user/scripts"
          export BLENDER_USER_EXTENSIONS="${RUNNER_TEMP}/blender-user/extensions"
          export BLENDER_USER_DATAFILES="${RUNNER_TEMP}/blender-user/datafiles"
          echo "BLENDER_USER_RESOURCES=${BLENDER_USER_RESOURCES}" >> "${GITHUB_ENV}"
          echo "BLENDER_USER_CONFIG=${BLENDER_USER_CONFIG}" >> "${GITHUB_ENV}"
          echo "BLENDER_USER_SCRIPTS=${BLENDER_USER_SCRIPTS}" >> "${GITHUB_ENV}"
          echo "BLENDER_USER_EXTENSIONS=${BLENDER_USER_EXTENSIONS}" >> "${GITHUB_ENV}"
          echo "BLENDER_USER_DATAFILES=${BLENDER_USER_DATAFILES}" >> "${GITHUB_ENV}"
          mkdir -p \
            "${BLENDER_USER_RESOURCES}" \
            "${BLENDER_USER_CONFIG}" \
            "${BLENDER_USER_SCRIPTS}" \
            "${BLENDER_USER_EXTENSIONS}" \
            "${BLENDER_USER_DATAFILES}" \
            "${RUNNER_TEMP}/blender-extensions"
          '${{ steps.blender.outputs.blender }}' \
            --command extension repo-add \
            --name "CATS CI" \
            --directory "${RUNNER_TEMP}/blender-extensions" \
            --clear-all \
            cats_ci

      - name: Install and enable built extension
        run: >-
          '${{ steps.blender.outputs.blender }}'
          --command extension install-file
          --repo cats_ci --enable "$PACKAGE_PATH"

      - name: Verify installed extension registration
        run: >-
          '${{ steps.blender.outputs.blender }}'
          --background --offline-mode -noaudio
          --python-exit-code 1 --python tests/extension_smoke.py
          -- --expect-enabled

      - name: Exercise Blender 5.2 API compatibility surfaces
        run: >-
          '${{ steps.blender.outputs.blender }}'
          --background --offline-mode -noaudio
          --python-exit-code 1 --python tests/blender_52_api_smoke.py

      - name: Exercise Pose Mode reset controls
        run: >-
          '${{ steps.blender.outputs.blender }}'
          --background --offline-mode -noaudio
          --python-exit-code 1 --python tests/pose_mode_smoke.py

      - name: Exercise Overdraw Prevention helpers
        run: >-
          '${{ steps.blender.outputs.blender }}'
          --background --offline-mode -noaudio
          --python-exit-code 1 --python tests/overdraw_smoke.py

      - name: Import every installed Python module
        run: >-
          '${{ steps.blender.outputs.blender }}'
          --background --offline-mode -noaudio
          --python-exit-code 1 --python tests/import_sweep.py

      - name: Stress extension registration lifecycle
        run: >-
          '${{ steps.blender.outputs.blender }}'
          --background --offline-mode -noaudio
          --python-exit-code 1 --python tests/lifecycle_stress.py

      - name: Run armature tests
        run: >-
          python tests/run.py
          --blend '${{ steps.blender.outputs.blender }}'
          --test './tests/armatures/*'
          --bfile './tests/armatures/armature.*'
          --ci

      - name: Run shape-key tests
        run: >-
          python tests/run.py
          --blend '${{ steps.blender.outputs.blender }}'
          --test './tests/shapekeys/shape_key_to_basis'
          --bfile './tests/shapekeys/shapekey.shape_key_to_basis'
          --ci

      - name: Remove extension
        run: >-
          '${{ steps.blender.outputs.blender }}'
          --command extension remove cats_blender_plugin

      - name: Verify extension removal
        run: >-
          '${{ steps.blender.outputs.blender }}'
          --background --offline-mode -noaudio
          --python-exit-code 1 --python tests/extension_smoke.py
          -- --expect-absent

      - name: Upload tested package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cats-blender-plugin-${{ matrix.platform }}-5.2.0
          path: ${{ runner.temp }}/cats_blender_plugin.zip
          if-no-files-found: error
          retention-days: 7

  release_gate:
    name: Check final release request
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release != '' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RELEASE_VERSION: ${{ inputs.release }}

    steps:
      - name: Check out source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Require an exact final manifest version
        run: >-
          python scripts/ci.py check-release
          --version "$RELEASE_VERSION"
          --manifest blender_manifest.toml

  release:
    name: Publish verified final release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release != '' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.visibility == 'public'
    needs: [validate, release_gate]
    runs-on: windows-2025
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.release }}

    steps:
      - name: Fetch exact public source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${EXPECTED_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Verify release Blender
        id: release_blender
        run: >-
          python scripts/ci.py prepare-blender
          --platform windows
          --output-dir '${{ runner.temp }}/release-blender-5.2.0'
          --github-output "$GITHUB_OUTPUT"

      - name: Build and validate fresh release ZIP
        run: |
          set -euo pipefail
          release_dir='${{ runner.temp }}/release'
          archive="${release_dir}/cats_blender_plugin-${RELEASE_VERSION}.zip"
          mkdir -p "${release_dir}"
          '${{ steps.release_blender.outputs.blender }}' \
            --command extension validate .
          '${{ steps.release_blender.outputs.blender }}' \
            --command extension build \
            --source-dir . \
            --output-filepath "${archive}"
          '${{ steps.release_blender.outputs.blender }}' \
            --command extension validate "${archive}"
          '${{ steps.release_blender.outputs.python }}' \
            tests/verify_package.py "${archive}" --source-dir .

      - name: Prepare release identity and checksum
        id: release_meta
        run: >-
          python scripts/ci.py prepare-release
          --version "$RELEASE_VERSION"
          --manifest blender_manifest.toml
          --archive '${{ runner.temp }}/release/cats_blender_plugin-${{ inputs.release }}.zip'
          --checksum-output '${{ runner.temp }}/release/SHA256SUMS.txt'
          --github-output "$GITHUB_OUTPUT"

      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag already exists: ${TAG}" >&2
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release already exists: ${TAG}" >&2
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: >-
          gh release create "$TAG"
          --draft
          --generate-notes
          --title "$TAG"
          --target '${{ github.sha }}'

      - name: Upload release ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: >-
          gh release upload "$TAG"
          '${{ runner.temp }}/release/${{ steps.release_meta.outputs.archive_name }}'
          '${{ runner.temp }}/release/SHA256SUMS.txt'

      - name: Download and verify stored ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          ARCHIVE_NAME: ${{ steps.release_meta.outputs.archive_name }}
          EXPECTED_SHA256: ${{ steps.release_meta.outputs.sha256 }}
        run: |
          set -euo pipefail
          stored_dir='${{ runner.temp }}/stored-release'
          mkdir -p "${stored_dir}"
          gh release download "${TAG}" \
            --pattern "${ARCHIVE_NAME}" \
            --dir "${stored_dir}"
          python scripts/ci.py verify-file \
            --file "${stored_dir}/${ARCHIVE_NAME}" \
            --expected-sha256 "${EXPECTED_SHA256}"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
